name: Handoff contracts
on:
  pull_request:
  push:
    branches: [develop]
permissions:
  contents: read
jobs:
  contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements-dev.txt -r requirements-handoffs.txt
      - run: python -m pytest
